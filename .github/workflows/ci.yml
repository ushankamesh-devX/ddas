name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -B test
          elif [ -f pom.xml ]; then
            mvn -B test
          else
            echo "Backend project not initialized yet; skipping."
          fi

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin checks
        working-directory: admin-web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "Admin app not initialized yet; skipping."
          fi

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mobile checks
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run lint --if-present
            npm test --if-present
          else
            echo "Mobile app not initialized yet; skipping."
          fi

  # Enable this job once the backend has CI fixtures/test users and starts
  # deterministically in GitHub Actions.
  bruno:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Bruno CLI (pin exact version)
        run: npm install -g @usebruno/cli@4
      - name: Start integration stack
        run: docker compose -f infra/docker-compose.dev.yml up -d
      - name: Start backend
        run: |
          echo "Wire the Spring Boot test profile here."
          exit 1
      - name: Bruno tests
        run: |
          cd bruno
          bru run --env environments/ci.bru --reporter-junit results.xml
