name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -B test
          elif [ -f pom.xml ]; then
            mvn -B test
          else
            echo "Backend project not initialized yet; skipping."
          fi

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin checks
        working-directory: admin-web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "Admin app not initialized yet; skipping."
          fi

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Mobile checks
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

  bruno:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start integration stack
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.dev.yml up -d
      - name: Start backend
        env:
          SPRING_PROFILES_ACTIVE: ci
          JWT_SECRET: ci-only-signing-secret-never-use-outside-tests-32chars
          APP_FIXTURE_PASSWORD: ChangeMeInCI
        run: |
          chmod +x backend/mvnw
          nohup backend/mvnw -B -f backend/pom.xml spring-boot:run > backend-ci.log 2>&1 &
          echo $! > backend-ci.pid
      - name: Wait for backend health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-ci.log
          exit 1
      - name: Bruno foundation and Dev 1 tests
        working-directory: bruno
        run: |
          npm ci
          npm run test:ci:dev1
      - name: Upload backend and Bruno reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-dev1-results
          path: |
            backend-ci.log
            bruno/results.xml
          if-no-files-found: ignore
      - name: Stop backend and integration stack
        if: always()
        run: |
          if [ -f backend-ci.pid ]; then
            kill "$(cat backend-ci.pid)" || true
          fi
          docker compose --env-file infra/.env.example -f infra/docker-compose.dev.yml down
