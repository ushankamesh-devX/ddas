spring:
  application:
    name: dam-alert-backend
  profiles:
    default: standalone
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  monitoring:
    stale-after: ${SENSOR_STALE_AFTER:5m}
    max-past-age: ${TELEMETRY_MAX_PAST_AGE:30d}
    max-future-skew: ${TELEMETRY_MAX_FUTURE_SKEW:5m}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      issuer: ${JWT_ISSUER:dam-alert-backend}
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  fixtures:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
