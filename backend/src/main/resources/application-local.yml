spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dam_alert}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  fixtures:
    enabled: ${APP_FIXTURES_ENABLED:true}
    password: ${APP_FIXTURE_PASSWORD:ChangeMe123!}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:dam-alert-reports}
